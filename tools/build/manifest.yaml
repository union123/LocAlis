# Инструмент сборки: npm install / npx tsc / ng build в указанной папке.
# Появился 24.08 (B6): без сборки «не могу гарантировать компилируемость» —
# теперь проверка компиляции это обычный tool call с возвратом ошибок модели.
name: build
version: 1.0.0
description: Запуск сборки и проверки типов (npm install, npx tsc --noEmit, ng build) в папке проекта
enabled: true
entrypoint: build_tool.py
class_name: BuildTool

requires:
  - Node.js >= 22 (в PATH)

config:
  # Максимальное время одной команды сборки. ng build на холодном кеше может
  # идти долго, но бесконечно ждать нельзя.
  timeout_sec: 600
  # Максимум символов вывода, возвращаемых модели (хвост важнее головы:
  # ошибки компиляции обычно в конце).
  max_output_chars: 8000
