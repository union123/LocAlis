name: desktop
version: 1.0.0
entrypoint: desktop_tool.py
description: >
description_en: "Desktop automation via pyautogui: screenshots, clicks by coordinates, typing (Cyrillic via clipboard), hotkeys, window focus. Controls the REAL mouse/keyboard."
  Управление ноутбуком целиком: скриншот всего экрана или окна, клики,
  ввод текста, горячие клавиши, список окон и фокус на приложение.
  Скриншот анализируется инструментом vision — платформа видит экран
  глазами и может работать с любыми приложениями Windows, а не только
  с браузером. ВАЖНО: двигает реальную мышь и печает реальную клавиатуру
  пользователя — использовать осознанно.
requires_context: true

config:
  # Пауза после каждого действия мыши/клавиатуры, сек (pyautogui FAILSAFE)
  action_pause_sec: 0.5
  # Куда складывать скриншоты
  shots_dir: data/browser_shots
