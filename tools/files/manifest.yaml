# Инструмент чтения файлов и папок.
# Появился по следам реальных задач от 03.08: модели просили содержимое
# .txt-файла, но в платформе был только QGIS (геоданные). Router верно
# определял needs_tools=true, а подходящего инструмента не существовало —
# модели вызывали QGIS для текстового файла и получали «не смог открыть слой».
name: files
version: 1.1.0
description: Чтение текстовых файлов, просмотр папок, поиск по содержимому, сведения о файле
enabled: true
entrypoint: files_tool.py
class_name: FilesTool

requires:
  - Ничего дополнительно (для .docx/.xlsx нужны python-docx и openpyxl)

config:
  # Максимум символов, возвращаемых за один вызов: защита от переполнения
  # контекста модели (8192 токенов у Proposers).
  max_chars: 20000
  # Максимум файлов в листинге папки
  max_entries: 200
  # Запрещённые к чтению расширения: бинарные и потенциально опасные
  blocked_extensions:
    - .exe
    - .dll
    - .msi
    - .7z
    - .zip
    - .rar
    - .iso
  # Пусто = разрешены любые пути. Заполните, чтобы ограничить доступ
  # инструмента только этими папками (рекомендуется для общего компьютера).
  allowed_roots: []
