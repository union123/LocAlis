# Инструмент-агент: локальные модели как самостоятельные агенты.
# Позволяет любой модели (и облачному арбитру) поручать работу конкретным
# локальным моделям, устраивать их обсуждение и делить задачу на подзадачи.
name: local_agents
version: 1.0.0
description: Локальные модели как агенты — поручить задачу, спросить мнение, обсудить, разбить на подзадачи
description_en: "Sub-agents: call a local model with a restricted toolset as a regular tool. Agents-as-tools pattern."
enabled: true
entrypoint: agents_tool.py
class_name: LocalAgentsTool

requires:
  - Ollama с загруженными локальными моделями

config:
  # Максимум участников в обсуждении (защита от долгих прогонов на 8 ГБ VRAM)
  max_debate_participants: 3
  # Максимум подзадач в одном вызове delegate_subtasks
  max_subtasks: 4
  # Разрешить под-агентам вызывать инструменты платформы.
  # false = под-агент только рассуждает (быстрее, без риска рекурсии)
  allow_nested_tools: true
