# Инструмент веб-поиска и извлечения текста страниц.
# Появился по итогам ночного аудита: платформа была полностью офлайн и не
# могла проверить свежие факты, найти документацию новой версии библиотеки
# или прочитать конкретную страницу, на которую ссылается пользователь.
#
# Локально-первый выбор библиотек (см. requirements.txt):
#   - ddgs   -> метапоиск (DuckDuckGo/Bing/Brave/Yahoo/Yandex/Google/Wikipedia),
#               без сервера и ключей API.
#   - httpx  -> уже используется платформой (health-check), просто скачиваем HTML.
#   - lxml   -> уже используется платформой, свой лёгкий алгоритм извлечения
#               основного текста (без внешних тяжёлых зависимостей типа
#               trafilatura/babel/dateparser, которые ставят тысячи файлов
#               локализации и непропорционально раздувают окружение ради
#               одной опциональной функции — определения даты публикации).
name: websearch
version: 1.0.0
description: Поиск в интернете по текстовому запросу и извлечение основного читаемого текста произвольной веб-страницы по ссылке
description_en: "DuckDuckGo web search returning compact results (title/url/snippet)."
enabled: true
entrypoint: websearch_tool.py
class_name: WebSearchTool

requires:
  - ddgs
  - httpx (уже в проекте)
  - lxml (уже в проекте)

config:
  # Сколько результатов возвращать по умолчанию, если модель не указала max_results
  default_max_results: 6
  # Верхняя граница, чтобы модель не запросила слишком много и не забила контекст
  max_max_results: 20
  # Таймаут скачивания страницы для fetch
  fetch_timeout_sec: 15
  # Максимум символов текста, возвращаемых за один вызов get_page_text
  # (защита от переполнения контекста модели, тот же принцип, что у tools/files)
  default_max_chars: 8000
  max_max_chars: 40000
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 agent-platform-websearch/1.0"
