# Инструмент компьютерного зрения через локальную мультимодальную модель.
#
# Реализован как прямой HTTP-вызов к уже работающему Ollama (REST API на
# localhost:11434), а не через возможность платформы ASK_LOCAL_MODEL —
# поэтому requires_context: false. Ноль новых pip-зависимостей: используется
# httpx, который уже есть в окружении.
#
# ВАЖНО (см. итоговый отчёт): на момент установки на сервере был найден
# рабочий Ollama с 11 текстовыми/embedding-моделями, но БЕЗ мультимодальной
# модели. Автоматически загрузить модель (`ollama pull ...`) через удалённый
# мост в эту ночь не удалось — see health(): инструмент честно сообщает
# "не готов" и называет команду, которую нужно выполнить самостоятельно.
name: vision
version: 1.0.0
description: Распознавание и описание изображений через локальную мультимодальную модель Ollama (описание сцены, ответ на вопрос по картинке, OCR)
enabled: true
entrypoint: vision_tool.py
class_name: VisionTool

requires:
  - "Ollama запущен на localhost (уже так на этом сервере)"
  - "В Ollama загружена мультимодальная модель, например: ollama pull qwen2.5vl:7b"
  - httpx (уже в проекте)

config:
  ollama_url: "http://localhost:11434"
  # Модель по умолчанию. На момент установки НЕ загружена — health() это обнаружит.
  model: "qwen2.5vl:7b"
  request_timeout_sec: 180
  # Список префиксов имён моделей, которые считаем мультимодальными,
  # для действия list_vision_models (не единственный способ проверки,
  # но избавляет от жёсткого перечисления всех версий).
  vision_name_hints:
    - "vl"
    - "vision"
    - "llava"
    - "moondream"
    - "bakllava"
    - "minicpm-v"
